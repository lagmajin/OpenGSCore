name: OpenGSCore build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore OpenGSCore.csproj

      - name: Build
        run: dotnet build OpenGSCore.csproj --configuration Release --no-restore

      # The trx logger produces the result file the reporter step turns into a
      # pull request comment, so a reviewer can see which tests ran without
      # reading the build log.
      - name: Test
        run: >-
          dotnet test Tests/OpenGSCore.Tests.csproj
          --configuration Release
          --logger "trx;LogFileName=core-tests.trx"
          --results-directory TestResults

      - name: Publish test report
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: OpenGSCore tests
          path: TestResults/*.trx
          reporter: dotnet-trx
          fail-on-error: true
          fail-on-empty: true